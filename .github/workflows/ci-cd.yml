name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test image
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t about-me-website:test .

      - name: Run container
        run: docker run -d --name site-test -p 8080:80 about-me-website:test

      - name: Smoke test
        run: |
          sleep 3
          for path in / /css/style.css /js/script.js /assets/docs/curriculo.pdf; do
            echo "Checking $path"
            curl --fail --silent --show-error --output /dev/null "http://localhost:8080$path"
          done

      - name: Show container logs on failure
        if: failure()
        run: docker logs site-test

      - name: Stop container
        if: always()
        run: docker rm -f site-test

  docker-hub:
    name: Build and publish image to Docker Hub
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ github.repository_owner }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker images
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ github.repository_owner }}/${{ github.event.repository.name }}:latest
          push: true

  deploy:
    name: Deploy on VPS
    needs: docker-hub
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, vps]
    concurrency: deploy-production

    steps:
      - name: Deploy
        run: deploy-app ${{ github.event.repository.name }} latest
